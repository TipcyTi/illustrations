<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ti">
  <meta name="description" content="Ti Illustrations">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="Ti.png">
  <link rel="apple-touch-startup-image" href="Ti.png">
  <title>Ti</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-text-size-adjust: none;
    }
    html {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }
    body {
      width: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      background: #F1F2ED;
      font-family: Impact, 'Arial Black', sans-serif;
      color: #000000;
      font-weight: 700;
      position: relative;
    }
    :root {
      --safe-area-inset-top: env(safe-area-inset-top, 0px);
      --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
      --safe-area-inset-left: env(safe-area-inset-left, 0px);
      --safe-area-inset-right: env(safe-area-inset-right, 0px);
      --radius: 14px;
    }

    /* ===== Auth Screen ===== */
    #auth-container {
      position: fixed;
      inset: 0;
      background: #F1F2ED;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: var(--safe-area-inset-top) var(--safe-area-inset-right) var(--safe-area-inset-bottom) var(--safe-area-inset-left);
      z-index: 100;
      transition: opacity 0.4s ease;
    }
    .auth-button {
      background: none;
      color: #000000;
      border: none;
      padding: 20px;
      font-size: 80px;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Snell Roundhand', 'Snell Roundhand Black', cursive;
      letter-spacing: -2px;
      line-height: 0.9;
      text-shadow: 0 0 18px rgba(0,0,0,0.25);
      position: relative;
    }
    .auth-button:active { transform: scale(0.92); opacity: 0.6; }
    .auth-button:disabled { opacity: 0.4; cursor: not-allowed; }
    .auth-button-loading::after {
      content: "";
      position: absolute;
      width: 24px; height: 24px;
      top: 50%; left: 50%;
      margin: -12px 0 0 -12px;
      border: 2px solid #000;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .button-sub {
      display: block;
      font-size: 11px;
      letter-spacing: 4px;
      opacity: 0.5;
      margin-top: 6px;
      font-family: Impact, sans-serif;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== Gallery ===== */
    #content-container {
      display: none;
      width: 100%;
      min-height: 100vh;
      background: #F1F2ED;
      opacity: 0;
      transition: opacity 0.4s ease;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: var(--safe-area-inset-top) var(--safe-area-inset-right) calc(24px + var(--safe-area-inset-bottom)) var(--safe-area-inset-left);
    }
    #content-container.active { opacity: 1; }

    .gallery-header {
      text-align: center;
      padding: 28px 20px 20px;
    }
    .gallery-header h1 {
      font-family: 'Snell Roundhand', cursive;
      font-size: 48px;
      font-weight: 400;
      text-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    .gallery-header p {
      font-size: 11px;
      letter-spacing: 3px;
      opacity: 0.45;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 0 16px;
    }
    @media (min-width: 768px) {
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
        padding: 0 32px;
        max-width: 1200px;
        margin: 0 auto;
      }
    }

    .gallery-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: var(--radius);
      overflow: hidden;
      background: #E4E5E0;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .gallery-item:active { transform: scale(0.96); }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .gallery-item img.loaded { opacity: 1; }

    .gallery-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      opacity: 0.35;
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* ===== Lightbox ===== */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(241,242,237,0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 200;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      padding: max(20px, var(--safe-area-inset-top)) max(20px, var(--safe-area-inset-right)) max(20px, var(--safe-area-inset-bottom)) max(20px, var(--safe-area-inset-left));
    }
    #lightbox.active { display: flex; opacity: 1; }
    #lightbox img {
      max-width: 100%;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.12);
    }
    #lightbox-close {
      position: absolute;
      top: max(16px, var(--safe-area-inset-top));
      right: max(16px, var(--safe-area-inset-right));
      width: 40px; height: 40px;
      background: rgba(0,0,0,0.06);
      border: none;
      border-radius: 50%;
      font-size: 22px;
      color: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Impact, sans-serif;
      transition: transform 0.15s, background 0.2s;
    }
    #lightbox-close:active { transform: scale(0.88); background: rgba(0,0,0,0.12); }
    #lightbox-caption {
      position: absolute;
      bottom: max(20px, var(--safe-area-inset-bottom));
      left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      letter-spacing: 1px;
      opacity: 0.45;
      padding: 0 20px;
    }

    .no-scroll { overflow: hidden; }

    @supports not (top: env(safe-area-inset-top)) {
      :root {
        --safe-area-inset-top: constant(safe-area-inset-top, 0px);
        --safe-area-inset-bottom: constant(safe-area-inset-bottom, 0px);
        --safe-area-inset-left: constant(safe-area-inset-left, 0px);
        --safe-area-inset-right: constant(safe-area-inset-right, 0px);
      }
    }
  </style>
</head>
<body class="no-scroll">

  <!-- Auth -->
  <div id="auth-container">
    <button class="auth-button" id="authButton">
      Ti
      <span class="button-sub">ILLUSTRATIONS</span>
    </button>
  </div>

  <!-- Gallery -->
  <div id="content-container">
    <div class="gallery-header">
      <h1>Ti</h1>
      <p>Illustration Collection</p>
    </div>
    <div class="gallery-grid" id="gallery"></div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox">
    <button id="lightbox-close">&times;</button>
    <img src="" alt="Preview" id="lightbox-img">
    <div id="lightbox-caption"></div>
  </div>

  <script>
    const CONFIG = {
      webauthn: {
        rpName: "Ti",
        userName: "Ti",
        userDisplayName: "'Ti'",
        timeout: 60000
      }
    };
    const AppState = { isAuthenticated: false, credentialId: null };
    const DOM = {
      authContainer: document.getElementById('auth-container'),
      contentContainer: document.getElementById('content-container'),
      authButton: document.getElementById('authButton'),
      gallery: document.getElementById('gallery'),
      lightbox: document.getElementById('lightbox'),
      lightboxImg: document.getElementById('lightbox-img'),
      lightboxClose: document.getElementById('lightbox-close'),
      lightboxCaption: document.getElementById('lightbox-caption')
    };

    // ===== Auth Manager =====
    const AuthManager = {
      init() {
        if (!window.PublicKeyCredential) { DOM.authButton.disabled = true; return; }
        try {
          const saved = localStorage.getItem('webauthn_credential_id');
          if (saved) AppState.credentialId = Uint8Array.from(saved.split(',').map(Number));
        } catch(e) { this.clearCred(); }
        DOM.authButton.addEventListener('click', () => this.start());
      },
      clearCred() { localStorage.removeItem('webauthn_credential_id'); AppState.credentialId = null; },
      reset() { DOM.authButton.disabled = false; DOM.authButton.classList.remove('auth-button-loading'); },
      async start() {
        try {
          DOM.authButton.disabled = true;
          DOM.authButton.classList.add('auth-button-loading');
          AppState.credentialId ? await this.authenticate() : await this.register();
        } catch(err) { this.clearCred(); this.reset(); }
      },
      async register() {
        const ch = new Uint8Array(32); crypto.getRandomValues(ch);
        const cred = await navigator.credentials.create({ publicKey: {
          challenge: ch, rp: { id: location.hostname, name: CONFIG.webauthn.rpName },
          user: { id: new Uint8Array(16), name: CONFIG.webauthn.userName, displayName: CONFIG.webauthn.userDisplayName },
          pubKeyCredParams: [{type:"public-key",alg:-7}],
          authenticatorSelection: { userVerification: "required" },
          timeout: CONFIG.webauthn.timeout, attestation: "none"
        }});
        if (cred?.rawId) {
          AppState.credentialId = new Uint8Array(cred.rawId);
          localStorage.setItem('webauthn_credential_id', Array.from(AppState.credentialId).join(','));
        }
        this.onSuccess();
      },
      async authenticate() {
        const ch = new Uint8Array(32); crypto.getRandomValues(ch);
        await navigator.credentials.get({ publicKey: {
          challenge: ch, rpId: location.hostname,
          allowCredentials: [{ type:"public-key", id: AppState.credentialId, transports:["internal"] }],
          userVerification: "required", timeout: CONFIG.webauthn.timeout
        }});
        this.onSuccess();
      },
      onSuccess() {
        AppState.isAuthenticated = true;
        DOM.authContainer.style.opacity = '0';
        setTimeout(() => {
          DOM.authContainer.style.display = 'none';
          DOM.contentContainer.style.display = 'block';
          document.body.classList.remove('no-scroll');
          requestAnimationFrame(() => DOM.contentContainer.classList.add('active'));
          Gallery.load();
        }, 350);
      }
    };

    // ===== Gallery =====
    const Gallery = {
      load() {
        fetch('/images.json')
          .then(r => r.ok ? r.json() : Promise.reject())
          .then(({ images }) => {
            if (!images?.length) { DOM.gallery.innerHTML = '<div class="gallery-empty">NO ILLUSTRATIONS YET</div>'; return; }
            images.forEach(img => {
              const item = document.createElement('div');
              item.className = 'gallery-item';
              const el = document.createElement('img');
              el.src = img.url; el.alt = img.name; el.loading = 'lazy';
              el.onload = () => el.classList.add('loaded');
              el.onerror = () => item.remove();
              item.appendChild(el);
              item.addEventListener('click', () => this.open(img.url, img.name));
              DOM.gallery.appendChild(item);
            });
          })
          .catch(() => { DOM.gallery.innerHTML = '<div class="gallery-empty">UNABLE TO LOAD</div>'; });
      },
      open(url, name) {
        DOM.lightboxImg.src = url;
        DOM.lightboxCaption.textContent = name;
        DOM.lightbox.classList.add('active');
        document.body.classList.add('no-scroll');
      },
      close() {
        DOM.lightbox.classList.remove('active');
        document.body.classList.remove('no-scroll');
        setTimeout(() => DOM.lightboxImg.src = '', 300);
      }
    };

    DOM.lightboxClose.addEventListener('click', () => Gallery.close());
    DOM.lightbox.addEventListener('click', e => { if(e.target === DOM.lightbox) Gallery.close(); });
    document.addEventListener('keydown', e => { if(e.key === 'Escape') Gallery.close(); });

    // ===== Init =====
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => AuthManager.init());
    else AuthManager.init();
  </script>
</body>
</html>
