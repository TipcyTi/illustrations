<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ti">
  <meta name="description" content="Ti">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="Ti.png">
  <link rel="apple-touch-startup-image" href="Ti.png">
  <title>Ti</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-text-size-adjust: none;
    }
    html {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }
    body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      background: #F1F2ED;
      font-family: Impact;
      color: #000000;
      font-weight: 700;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
    :root {
      --safe-area-inset-top: env(safe-area-inset-top, 0px);
      --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
      --safe-area-inset-left: env(safe-area-inset-left, 0px);
      --safe-area-inset-right: env(safe-area-inset-right, 0px);
      --Ti-image-radius: 50px;
    }
    #auth-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #F1F2ED;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-top: var(--safe-area-inset-top);
      padding-bottom: var(--safe-area-inset-bottom);
      padding-left: var(--safe-area-inset-left);
      padding-right: var(--safe-area-inset-right);
      z-index: 100;
      overflow: hidden;
      transition: opacity 0.3s ease;
      box-sizing: border-box;
    }
    .auth-button-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .auth-button {
      background: none;
      color: #000000;
      border: none;
      border-radius: 0;
      padding: 20px 15px;
      font-size: 72px;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Snell Roundhand', 'Snell Roundhand Black', cursive;
      position: relative;
      overflow: hidden;
      letter-spacing: -1px;
      line-height: 0.9;
      text-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
      width: 75%;
      max-width: 400px;
    }
    .auth-button:active {
      transform: scale(0.95);
      opacity: 0.7;
    }
    .auth-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .auth-button-loading .button-text-container {
      opacity: 0;
    }
    .auth-button-loading::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      top: 50%;
      left: 50%;
      margin-left: -10px;
      margin-top: -10px;
      border: 2px solid #000000;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s ease infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .button-text-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .button-main-text {
      font-size: 1em;
      margin-bottom: 2px;
      width: 100%;
      text-align: center;
    }
    .no-scroll {
      overflow: hidden !important;
    }

    /* ===== Gallery ===== */
    #content-container {
      display: none;
      width: 100%;
      min-height: 100vh;
      background: #F1F2ED;
      opacity: 0;
      transition: opacity 0.3s ease;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-top: var(--safe-area-inset-top);
      padding-bottom: calc(24px + var(--safe-area-inset-bottom));
      padding-left: var(--safe-area-inset-left);
      padding-right: var(--safe-area-inset-right);
      box-sizing: border-box;
      position: relative;
    }
    #content-container.active {
      opacity: 1;
    }
    .gallery-header {
      text-align: center;
      padding: 28px 20px 20px;
    }
    .gallery-header h1 {
      font-family: 'Snell Roundhand', 'Snell Roundhand Black', cursive;
      font-size: 64px;
      font-weight: 400;
      text-shadow: 0 0 15px rgba(0,0,0,0.15);
      line-height: 0.9;
    }
    .gallery-header p {
      font-family: Impact, sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      opacity: 0.4;
      margin-top: 8px;
      text-transform: uppercase;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 0 16px 24px;
    }
    @media (min-width: 768px) {
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
        padding: 0 32px 32px;
        max-width: 1200px;
        margin: 0 auto;
      }
    }
    .gallery-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 16px;
      overflow: hidden;
      background: #E4E5E0;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .gallery-item:active {
      transform: scale(0.96);
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .gallery-item img.loaded {
      opacity: 1;
    }
    .gallery-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 100px 20px;
      opacity: 0.35;
      font-family: Impact, sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* ===== Lightbox ===== */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(241,242,237,0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 200;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      padding: max(20px, var(--safe-area-inset-top)) max(20px, var(--safe-area-inset-right)) max(20px, var(--safe-area-inset-bottom)) max(20px, var(--safe-area-inset-left));
    }
    #lightbox.active {
      display: flex;
      opacity: 1;
    }
    #lightbox img {
      max-width: 100%;
      max-height: 78vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.1);
    }
    #lightbox-close {
      position: absolute;
      top: max(16px, var(--safe-area-inset-top));
      right: max(16px, var(--safe-area-inset-right));
      width: 44px;
      height: 44px;
      background: rgba(0,0,0,0.06);
      border: none;
      border-radius: 50%;
      font-size: 24px;
      color: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Impact, sans-serif;
      transition: transform 0.15s, background 0.2s;
    }
    #lightbox-close:active {
      transform: scale(0.88);
      background: rgba(0,0,0,0.12);
    }
    .lightbox-footer {
      position: absolute;
      bottom: max(20px, var(--safe-area-inset-bottom));
      left: 0;
      right: 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 0 20px;
    }
    #lightbox-caption {
      font-family: Impact, sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
      opacity: 0.45;
    }
    #lightbox-brand {
      font-family: 'Snell Roundhand', 'Snell Roundhand Black', cursive;
      font-size: 13px;
      opacity: 0.35;
      letter-spacing: 0.5px;
    }

    @supports not (top: env(safe-area-inset-top)) {
      :root {
        --safe-area-inset-top: constant(safe-area-inset-top, 0px);
        --safe-area-inset-bottom: constant(safe-area-inset-bottom, 0px);
        --safe-area-inset-left: constant(safe-area-inset-left, 0px);
        --safe-area-inset-right: constant(safe-area-inset-right, 0px);
      }
    }
  </style>
</head>
<body class="no-scroll">
  <div id="auth-container">
    <div class="auth-button-container">
      <button class="auth-button" id="authButton">
        <div class="button-text-container">
          <div class="button-main-text">Ti</div>
        </div>
      </button>
    </div>
  </div>

  <div id="content-container">
    <div class="gallery-header">
      <h1>Ti</h1>
      <p>Illustrations</p>
    </div>
    <div class="gallery-grid" id="gallery"></div>
  </div>

  <div id="lightbox">
    <button id="lightbox-close">&times;</button>
    <img src="" alt="Preview" id="lightbox-img">
    <div class="lightbox-footer">
      <div id="lightbox-caption"></div>
      <div id="lightbox-brand">Ti Illustrations</div>
    </div>
  </div>

  <script>
    const CONFIG = {
      webauthn: {
        rpName: "Ti",
        userName: "Ti",
        userDisplayName: "'Ti'",
        timeout: 60000
      }
    };
    const AppState = {
      isAuthenticated: false,
      credentialId: null
    };
    const DOM = {
      authContainer: document.getElementById('auth-container'),
      contentContainer: document.getElementById('content-container'),
      authButton: document.getElementById('authButton'),
      gallery: document.getElementById('gallery'),
      lightbox: document.getElementById('lightbox'),
      lightboxImg: document.getElementById('lightbox-img'),
      lightboxClose: document.getElementById('lightbox-close'),
      lightboxCaption: document.getElementById('lightbox-caption')
    };

    // Named handlers so we can remove them later
    function blockScroll(e) {
      e.preventDefault();
      window.scrollTo(0, 0);
      return false;
    }

    const AuthManager = {
      init: function() {
        if (!window.PublicKeyCredential) {
          DOM.authButton.disabled = true;
          return;
        }
        this.checkExistingCredentials();
        DOM.authButton.addEventListener('click', () => this.startAuthentication());
        this.preventScroll();
      },
      preventScroll: function() {
        document.body.addEventListener('touchmove', blockScroll, { passive: false });
        window.addEventListener('scroll', blockScroll, { passive: false });
        window.addEventListener('touchmove', blockScroll, { passive: false });
      },
      allowScroll: function() {
        document.body.removeEventListener('touchmove', blockScroll, { passive: false });
        window.removeEventListener('scroll', blockScroll, { passive: false });
        window.removeEventListener('touchmove', blockScroll, { passive: false });
      },
      checkExistingCredentials: function() {
        try {
          const savedCredentialId = localStorage.getItem('webauthn_credential_id');
          if (savedCredentialId) {
            AppState.credentialId = Uint8Array.from(savedCredentialId.split(',').map(Number));
          }
        } catch (error) {
          this.clearInvalidCredential();
        }
      },
      clearInvalidCredential: function() {
        localStorage.removeItem('webauthn_credential_id');
        AppState.credentialId = null;
      },
      resetAuthButtonState: function() {
        DOM.authButton.disabled = false;
        DOM.authButton.classList.remove('auth-button-loading');
      },
      startAuthentication: async function() {
        try {
          DOM.authButton.disabled = true;
          DOM.authButton.classList.add('auth-button-loading');
          if (AppState.credentialId) {
            await this.authenticateWithCredential();
          } else {
            await this.registerNewCredential();
          }
        } catch (error) {
          this.clearInvalidCredential();
          this.resetAuthButtonState();
        }
      },
      registerNewCredential: async function() {
        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);
        const publicKey = {
          challenge: challenge,
          rp: {
            id: window.location.hostname,
            name: CONFIG.webauthn.rpName
          },
          user: {
            id: new Uint8Array(16),
            name: CONFIG.webauthn.userName,
            displayName: CONFIG.webauthn.userDisplayName
          },
          pubKeyCredParams: [
            { type: "public-key", alg: -7 }
          ],
          authenticatorSelection: {
            userVerification: "required",
            requireResidentKey: false
          },
          timeout: CONFIG.webauthn.timeout,
          attestation: "none"
        };
        const credential = await navigator.credentials.create({ publicKey: publicKey });
        if (credential && credential.rawId) {
          AppState.credentialId = new Uint8Array(credential.rawId);
          localStorage.setItem('webauthn_credential_id', Array.from(AppState.credentialId).join(','));
        }
        this.onAuthenticationSuccess();
      },
      authenticateWithCredential: async function() {
        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);
        const publicKey = {
          challenge: challenge,
          rpId: window.location.hostname,
          allowCredentials: [
            {
              type: "public-key",
              id: AppState.credentialId,
              transports: ["internal"]
            }
          ],
          userVerification: "required",
          timeout: CONFIG.webauthn.timeout
        };
        const assertion = await navigator.credentials.get({ publicKey: publicKey });
        if (assertion) {
          this.onAuthenticationSuccess();
        } else {
          throw new Error("Authentication failed");
        }
      },
      onAuthenticationSuccess: function() {
        AppState.isAuthenticated = true;
        UI.showContent();
      }
    };

    const UI = {
      showContent: function() {
        DOM.authContainer.style.opacity = "0";
        setTimeout(() => {
          DOM.authContainer.style.display = "none";
          DOM.contentContainer.style.display = "block";
          document.body.classList.remove('no-scroll');
          document.body.style.position = "relative";
          document.body.style.overflow = "auto";
          AuthManager.allowScroll();
          DOM.contentContainer.offsetHeight;
          setTimeout(() => {
            DOM.contentContainer.classList.add('active');
          }, 50);
          Gallery.load();
        }, 300);
      }
    };

    const Gallery = {
      load: function() {
        fetch('/images.json')
          .then(r => r.ok ? r.json() : Promise.reject())
          .then(({ images }) => {
            if (!images || images.length === 0) {
              DOM.gallery.innerHTML = '<div class="gallery-empty">NO ILLUSTRATIONS YET</div>';
              return;
            }
            images.forEach(img => {
              const item = document.createElement('div');
              item.className = 'gallery-item';
              const el = document.createElement('img');
              el.src = img.url;
              el.alt = img.name;
              el.loading = 'lazy';
              el.onload = () => el.classList.add('loaded');
              el.onerror = () => item.remove();
              item.appendChild(el);
              item.addEventListener('click', () => Gallery.open(img.url, img.name));
              DOM.gallery.appendChild(item);
            });
          })
          .catch(() => {
            DOM.gallery.innerHTML = '<div class="gallery-empty">UNABLE TO LOAD IMAGES</div>';
          });
      },
      open: function(url, name) {
        DOM.lightboxImg.src = url;
        DOM.lightboxCaption.textContent = name;
        DOM.lightbox.classList.add('active');
        document.body.classList.add('no-scroll');
      },
      close: function() {
        DOM.lightbox.classList.remove('active');
        document.body.classList.remove('no-scroll');
        setTimeout(() => DOM.lightboxImg.src = '', 300);
      }
    };

    DOM.lightboxClose.addEventListener('click', () => Gallery.close());
    DOM.lightbox.addEventListener('click', e => {
      if (e.target === DOM.lightbox) Gallery.close();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') Gallery.close();
    });

    function initApp() {
      AuthManager.init();
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
